<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aqua Flow System">
  <defs>
    <radialGradient id="tile" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1f8f6a"/>
      <stop offset=".45" stop-color="#0d4a38"/>
      <stop offset="1" stop-color="#05211a"/>
    </radialGradient>
    <linearGradient id="gold" x1="120" y1="150" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbeec4"/>
      <stop offset=".42" stop-color="#e2c27a"/>
      <stop offset=".75" stop-color="#c39a45"/>
      <stop offset="1" stop-color="#9c7424"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1e2bb" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#f1e2bb" stop-opacity=".08"/>
      <stop offset="1" stop-color="#d9b766" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="16" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gloss)"/>
  <rect x="19" y="19" width="474" height="474" rx="109" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Mark: gold fish with a flowing water line, over a ripple -->
  <g transform="translate(13 -20)">
    <path fill="url(#gold)" d="M392 256C350 190 270 168 206 196c-24 11-43 28-56 44l-38-44c-8-8-20-2-17 9l15 51-15 51c-3 11 9 17 17 9l38-44c13 16 32 33 56 44 64 28 144 6 186-60Z"/>
    <path fill="none" stroke="#0b3a2c" stroke-width="13" stroke-linecap="round" d="M166 264c30-24 58 14 96-6"/>
    <path fill="none" stroke="#0b3a2c" stroke-width="12" stroke-linecap="round" d="M300 206c-20 30-20 70 0 100"/>
    <circle cx="342" cy="238" r="12" fill="#0b3a2c"/>
    <path fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-opacity=".6" d="M146 378c40-24 78 20 118 0s78-24 118 0"/>
  </g>
</svg>
